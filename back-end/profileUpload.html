<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile picture upload</title>
  </head>
  <body>
    <form action="POST" id="profile-picture">
      <input type="file" name="picture" />
      <input type="submit" value="Upload" />
    </form>
    <script>
      const form = document.querySelector("#profile-picture");
      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const body = new FormData(form);
        const res = fetch("http://localhost:8080/api/users/me/picture", {
          method: "PATCH",
          body: body,
        });

        res
          .then((r) => r.json())
          .then((d) => console.log(d))
          .catch((e) => console.error(e));
      });
    </script>
  </body>
</html>
